name: cloud-file-manager

services:
  db:
    container_name: cloud-file-manager-db
    image: postgres:14.1
    environment:
      POSTGRES_USER: filemanager
      POSTGRES_PASSWORD: password
      POSTGRES_DB: filemanager
      PGDATA: /data/postgres
    volumes:
      - db:/data/postgres
    ports:
      - "${DB_HOST_PORT:-5332}:5432"
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filemanager -d filemanager"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  minio:
    container_name: cloud-file-manager-minio
    image: quay.io/minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data
    networks:
      - db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  minio-init:
    container_name: cloud-file-manager-minio-init
    image: quay.io/minio/mc:latest
    networks:
      - db
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/filemanager-files
      "
  clamav:
    container_name: cloud-file-manager-clamav
    image: clamav/clamav:latest
    platform: linux/amd64
    networks:
      - db
    volumes:
      - clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 300s
    restart: unless-stopped
  backend:
    container_name: cloud-file-manager-backend
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/filemanager
      SPRING_DATASOURCE_USERNAME: filemanager
      SPRING_DATASOURCE_PASSWORD: password
      AWS_S3_MOCK: "false"
      AWS_S3_ENDPOINT: "http://minio:9000"
      AWS_S3_PUBLIC_ENDPOINT: "http://localhost:9000"
      AWS_S3_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      EMAIL_ENABLED: "false"
      MALWARE_SCAN_ENABLED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    ports:
      - "8080:8080"
    networks:
      - db
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    container_name: cloud-file-manager-frontend
    build:
      context: ./frontend
      args:
        api_base_url: http://localhost:8080
    ports:
      - "3000:5173"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  db:
    driver: bridge

volumes:
  db:
  minio:
  clamav:
